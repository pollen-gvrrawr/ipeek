# CI pipeline for IPeek (Project Activity 4).
# Runs every unit test on Windows and Linux whenever code is pushed to any
# branch or a pull request is opened into main. The branch protection rule on
# main requires both jobs to pass, so a change that breaks a test cannot be
# merged.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  unittest:
    name: unittest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the unit tests
        run: python -m unittest discover -s tests -v
